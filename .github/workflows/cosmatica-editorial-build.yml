name: Cosmatica Editorial Snapshot
on:
  push:
    branches:
      - feat/cosmatica-full-editorial-content-20261008
    paths:
      - "design/cosmatica-2026/site/integration/build-editorial-snapshot.py"
      - ".github/workflows/cosmatica-editorial-build.yml"
  workflow_dispatch:

concurrency:
  group: cosmatica-editorial-snapshot-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cosmatica-full-editorial-content-20261008
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install content processing dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pillow
      - name: Compile authorized editorial pages and assets
        working-directory: design/cosmatica-2026/site
        run: |
          python integration/build-editorial-snapshot.py
          python integration/check-editorial-package.py
      - name: Store full content snapshot in working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/cosmatica-2026/site/data/
          git add design/cosmatica-2026/site/assets/source/
          git add design/cosmatica-2026/site/integration/*-build-report.json
          if ! git diff --cached --quiet; then
            git commit -m "build: complete editorial snapshot from approved sources"
            git fetch origin feat/cosmatica-full-editorial-content-20261008
            git rebase origin/feat/cosmatica-full-editorial-content-20261008
            git push origin HEAD:feat/cosmatica-full-editorial-content-20261008
          fi
