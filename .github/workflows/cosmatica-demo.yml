name: Cosmatica Mockups QA
on:
  pull_request:
    paths:
      - "design/cosmatica-2026/**"
      - ".github/workflows/cosmatica-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

# Утверждённое оформление — «Гибрид», макеты в design/cosmatica-2026/bs4.
# Прежний прототип site/ и его проверки убраны 07.11.2026; в site/ осталась выгрузка сайта.
jobs:
  mockups:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pages are up to date with the generator
        run: |
          cd design/cosmatica-2026/bs4
          node build.mjs
          git diff --exit-code -- . || (echo "Страницы не пересобраны: запустите node build.mjs" && exit 1)
      - name: Structural checks
        run: |
          node design/cosmatica-2026/bs4/qa/check.mjs
          node --test design/cosmatica-2026/site/integration/cms-adapter.test.mjs
      - name: Install Chromium
        working-directory: design/cosmatica-2026/bs4
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser checks (35 pages × 5 widths)
        run: |
          python3 -m http.server 8768 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 2
          cd design/cosmatica-2026/bs4
          node qa/check.mjs --browser
